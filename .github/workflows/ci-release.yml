name: Build and release

# On every push to main: run the tests, build the portable archive, and, only
# if that all succeeds, publish a GitHub Release for that exact commit.
# Pull requests and manual runs build and test but never publish.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit cancels any older run still in progress, so only the latest
# commit gets built and released.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Auto-incrementing version, e.g. 1.0.42. Change the "1.0" prefix by hand
  # when you want to bump major/minor.
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build (Ubuntu 24.04 amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Go (module + build cache)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # Two modules, so key the Go module and build caches on both.
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Install build dependencies (apt cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential pkg-config libgtk-4-dev gobject-introspection zip
          # Bump to force a fresh apt cache after editing the package list.
          version: 1.0

      - name: Run unit tests
        run: |
          go test ./...
          (cd desktop && go test ./...)

      - name: Build the portable release archive
        run: ./build-portable-package.sh

      - name: Create checksums
        working-directory: dist
        run: sha256sum mysterium-vpn-linux-*.tar.gz mysterium-vpn-linux-*.zip > SHA256SUMS

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/mysterium-vpn-linux-*.tar.gz
            dist/mysterium-vpn-linux-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Only for pushes to main, and only when the build job succeeded.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the build output
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create the GitHub Release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" release/* \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
